name: Chrome Web Store Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: chrome-webstore-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"

jobs:
  build:
    name: Build extension package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.version.outputs.zip_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag version
        id: version
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($VERSION) must match tag ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build

      - name: Validate package
        run: |
          ZIP="release/${{ steps.version.outputs.zip_name }}"
          MANIFEST="/tmp/taby-manifest.json"

          if [ ! -f "$ZIP" ]; then
            echo "Expected package not found: $ZIP" >&2
            exit 1
          fi

          if ! unzip -Z1 "$ZIP" | grep -qx "manifest.json"; then
            echo "Package must contain manifest.json at the zip root." >&2
            exit 1
          fi

          unzip -p "$ZIP" manifest.json > "$MANIFEST"
          MANIFEST_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('$MANIFEST', 'utf8')).version")"

          if [ "$MANIFEST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) must match package version ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-webstore-${{ steps.version.outputs.version }}
          path: release/${{ steps.version.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-webstore-${{ needs.build.outputs.version }}
          path: release

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          awk -v version="$VERSION" '
            $0 ~ "^##[[:space:]]+" version "([[:space:]]|-|$)" { found = 1; next }
            found && /^##[[:space:]]+/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "No changelog entry found for version $VERSION." >&2
            exit 1
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Show release notes
        run: cat "${{ steps.changelog.outputs.notes_file }}"

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          name: ${{ needs.build.outputs.version }}
          bodyFile: ${{ steps.changelog.outputs.notes_file }}
          artifacts: release/${{ needs.build.outputs.zip_name }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

  publish:
    name: Publish to Chrome Web Store
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: chrome-webstore-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-webstore-${{ needs.build.outputs.version }}
          path: release

      - name: Publish package
        env:
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_APPLICATION_CREDENTIALS: .secrets/chrome-webstore-sa.json
          ZIP_FILE: release/${{ needs.build.outputs.zip_name }}
        run: |
          for key in PUBLISHER_ID EXTENSION_ID SERVICE_ACCOUNT_JSON_BASE64; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub secret mapped to $key." >&2
              exit 1
            fi
          done

          mkdir -p .secrets
          echo "$SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"

          node scripts/chrome-webstore.mjs

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: edge-addons-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-webstore-${{ needs.build.outputs.version }}
          path: release

      - name: Publish package
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          ZIP_FILE: release/${{ needs.build.outputs.zip_name }}
        run: |
          for key in EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub secret mapped to $key." >&2
              exit 1
            fi
          done

          node scripts/edge-addons.mjs
